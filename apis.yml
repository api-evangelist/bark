aid: bark
name: Bark
description: Bark is a digital safety and parental-controls company that helps families
  keep children safer online and in the real world. Its AI-powered platform monitors
  texts, email, social media, web browsing, and 30+ apps across more than 20 content
  categories, flagging potential issues such as online predators, cyberbullying, self-harm,
  and adult content, and pairs that monitoring with screen-time management, app blocking,
  web filtering, and GPS location alerts. Bark ships as an app for existing iOS and
  Android devices as well as purpose-built hardware including the Bark Phone, Bark
  Watch, and Bark Home.
